  flutter_local_notifications: ^22.3.0
  connectivity_plus: ^7.0.0
  dio: ^5.9.2
  flutter_secure_storage: ^11.0.0
  path: ^1.8.2
  firebase_core: ^4.2.1
  image_picker: ^1.2.1
  device_info_plus: ^13.2.0
  firebase_messaging: ^16.1.1
